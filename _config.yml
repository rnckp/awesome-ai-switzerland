title: Awesome AI Switzerland
description: An independent, community-curated guide to Apertus models, tools, research, and projects from the Swiss AI ecosystem.
url: https://rnckp.github.io
baseurl: /awesome-ai-switzerland
repository: rnckp/awesome-ai-switzerland
plugins:
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links

include:
  - README.md
  - HACK_APERTUS.md
  - CONTRIBUTING.md
  - LICENSE

readme_index:
  remove_originals: true

optional_front_matter:
  remove_originals: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "README.md"
    values:
      permalink: /

exclude:
  - RESEARCH.md
  - .agent
  - AGENTS.md
  - src
  - pyproject.toml
  - uv.lock
  - _.code-workspace
  - Gemfile
  - Gemfile.lock
  - vendor
  - tests
  - Makefile
  - count_sources.md
  - link-check-report.md
