[project]
name = "awesome-ai-switzerland"
version = "0.1.0"
description = "Maintenance helpers for the awesome-ai-switzerland directory"
readme = "README.md"
authors = [
    { name = "Patrick Arnecke", email = "mail@arnecke.ch" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["ruff>=0.16.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
count-sources = "awesome_ai_switzerland.count_sources:main"
check-links = "awesome_ai_switzerland.link_checker:main"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]
